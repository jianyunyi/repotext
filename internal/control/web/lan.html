<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>RepoTest — 只读查看</title>
<style>
:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#18211f;background:#f4f3ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% -10%,#d6e8dc 0,transparent 44%),#f4f3ed}.shell{max-width:1040px;margin:auto;padding:28px 28px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #ccd4ce;padding:7px 0 24px}.brand{font-weight:800;letter-spacing:-.04em;font-size:20px}.brand span{color:#268264}.badge{font-size:12px;color:#52645b;border:1px solid #c8d3cb;border-radius:99px;padding:8px 11px}.hero{padding:52px 0 32px}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.15;letter-spacing:-.03em;margin:0 0 18px}.hero p{font-size:17px;color:#52645b;line-height:1.6;max-width:650px;margin:0}.panel{background:#fff;border:1px solid #dfe5df;border-radius:16px;padding:24px;margin-top:20px}.panel h2{margin:0 0 12px;font-size:21px}.formrow{display:flex;gap:10px;align-items:end}.inputwrap{flex:1;min-width:0}.label{display:block;font-size:13px;font-weight:650;color:#52645b;margin:0 0 9px}.field{width:100%;height:48px;border:1px solid #cdd7d0;border-radius:8px;padding:0 13px;font:15px ui-monospace,monospace;color:#1c2b24}.field:focus{outline:3px solid #32866a40;border-color:#32866a}button{border:0;border-radius:8px;background:#176b50;color:#fff;font-weight:700;padding:0 20px;min-height:48px;cursor:pointer}button:hover{background:#12573f}button:focus-visible{outline:3px solid #32866a80;outline-offset:3px}button:disabled{opacity:.55;cursor:wait}.hint{font-size:13px;color:#52645b;line-height:1.6;margin:12px 0}.feedback{margin-top:14px;line-height:1.6;overflow-wrap:anywhere}.error{color:#a53627}.item{margin-top:18px;padding-top:18px;border-top:1px solid #dfe5df}.item h3{margin:0 0 12px;font-size:18px}.item p,.item pre{overflow-wrap:anywhere}.item pre{white-space:pre-wrap;background:#f6f8f5;padding:12px;border-radius:8px;font-size:13px;line-height:1.6}.packages{padding-left:20px}.packages li{margin:12px 0;overflow-wrap:anywhere}.foot{margin-top:36px;color:#52645b;font-size:13px}.field::placeholder{color:#65766c}::selection{background:#cde9dc;color:#18211f}
@media(max-width:650px){.shell{padding:18px 16px 56px}.hero{padding:36px 0 18px}.panel{padding:18px}.formrow{display:block}.formrow button{width:100%;margin-top:10px}.top{align-items:start}.badge{white-space:nowrap}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">repo<span>test</span></div><div class="badge">局域网 · 只读</div></header>
<section class="hero"><h1>查看任务与测试报告</h1><p>使用管理员提供的一次性配对码绑定此设备，再输入任务 ID 查看状态、报告和日志。</p></section>
<section class="panel" aria-labelledby="pair-heading"><h2 id="pair-heading">设备配对</h2><form id="pair-form"><div class="formrow"><div class="inputwrap"><label class="label" for="pair-code">配对码</label><input class="field" id="pair-code" name="code" required maxlength="64" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><button id="pair-submit" type="submit">配对设备</button></div></form><p class="hint">配对码仅由管理员提供，一次有效。已配对的设备可直接查询任务。</p><div id="pair-feedback" class="feedback" role="status" aria-live="polite"></div></section>
<section class="panel" aria-labelledby="task-heading"><h2 id="task-heading">查询任务</h2><form id="task-form"><div class="formrow"><div class="inputwrap"><label class="label" for="task-id">任务 ID</label><input class="field" id="task-id" name="task_id" required maxlength="128" autocomplete="off" spellcheck="false" placeholder="由本机管理员提供"></div><button id="task-submit" type="submit">查询任务</button></div></form><div id="task-result" class="feedback" aria-live="polite"></div></section>
<footer class="foot">此页面只提供查看功能。任务提交、取消、删除和设备管理由本机管理员操作。</footer>
</main>
<script>
const pairForm=document.querySelector('#pair-form');
const pairFeedback=document.querySelector('#pair-feedback');
const taskForm=document.querySelector('#task-form');
const taskResult=document.querySelector('#task-result');
let view=0,pollTimer;
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fail(message){taskResult.className='feedback error';taskResult.textContent=message}
pairForm.addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#pair-submit');button.disabled=true;pairFeedback.className='feedback';pairFeedback.textContent='正在配对…';try{const response=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.querySelector('#pair-code').value.trim()})});if(!response.ok)throw new Error('配对失败。请向管理员获取有效配对码后重试。');pairForm.reset();pairFeedback.textContent='设备已配对，可以查询任务。'}catch(error){pairFeedback.className='feedback error';pairFeedback.textContent=error.message||'无法连接服务，请稍后重试。'}finally{button.disabled=false}});
taskForm.addEventListener('submit',event=>{event.preventDefault();clearTimeout(pollTimer);const generation=++view;taskResult.className='feedback';taskResult.textContent='正在读取任务…';readTask(document.querySelector('#task-id').value.trim(),generation)});
async function readTask(id,generation){try{const response=await fetch('/api/v1/tasks/'+encodeURIComponent(id),{cache:'no-store'});if(generation!==view)return;if(response.status===401)throw new Error('设备尚未配对或登录已失效。请重新获取配对码。');if(!response.ok)throw new Error('未找到任务，请核对任务 ID 后重试。');const task=await response.json();if(generation!==view)return;const labels={queued:'排队中',running:'运行中',succeeded:'测试完成',failed:'测试失败',timeout:'已超时',cancelled:'已取消',error:'执行错误'};taskResult.className='feedback';taskResult.innerHTML='<div class="item"><h3>'+escapeHTML(labels[task.status]||task.status)+'</h3><p>任务 ID：'+escapeHTML(task.id)+'</p><p>'+escapeHTML(task.repo_url)+'</p>'+(task.phase?'<p>当前阶段：'+escapeHTML(task.phase)+'</p>':'')+(task.error_message?'<p class="error">'+escapeHTML(task.error_message)+'</p>':'')+'</div>';if(['queued','running'].includes(task.status)){pollTimer=setTimeout(()=>readTask(id,generation),1200);return}await readArtifacts(id,generation)}catch(error){if(generation===view)fail(error.message||'无法连接服务，请重新查询。')}}
async function readArtifacts(id,generation){for(const kind of ['report','log']){const response=await fetch('/api/v1/tasks/'+encodeURIComponent(id)+'/'+kind,{cache:'no-store'});if(generation!==view)return;if(response.status===401)throw new Error('设备登录已失效。请重新获取配对码。');if(!response.ok){taskResult.insertAdjacentHTML('beforeend','<div class="item">'+(kind==='report'?'暂无测试报告。':'暂无任务日志。')+'</div>');continue}if(kind==='log'){const body=await response.text();if(generation!==view)return;taskResult.insertAdjacentHTML('beforeend','<div class="item"><h3>任务日志</h3><pre>'+escapeHTML(body)+'</pre></div>')}else{const report=await response.json();if(generation!==view)return;const rows=(report.packages||[]).map(pkg=>'<li>'+escapeHTML(pkg.status)+' · '+escapeHTML(pkg.import_path)+(pkg.output?'<pre>'+escapeHTML(pkg.output)+'</pre>':'')+'</li>').join('');taskResult.insertAdjacentHTML('beforeend','<div class="item"><h3>测试报告</h3><p>'+escapeHTML(report.go_version)+'</p>'+(report.no_tests?'<p>未发现测试包。</p>':'')+'<ul class="packages">'+rows+'</ul></div>')}}}
</script></body></html>
